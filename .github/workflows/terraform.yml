name: Terraform lab7 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab7-terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}